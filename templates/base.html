{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static "css/bootstrap.min.css" %}">
    {% include "includes/card_style.html" %}
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" id="dropdownMenuButton"
                    data-bs-toggle="dropdown" aria-expanded="false">
                Меню
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <li><a class="dropdown-item" href="{% url 'catalog:home' %}">Каталог</a></li>
                <li><a class="dropdown-item" href="{% url 'catalog:product_create' %}">Создать продукт</a></li>
                <li><a class="dropdown-item" href="{% url 'catalog:contacts' %}">Контакты</a></li>
                <li><a class="dropdown-item" href="{% url 'blog:post_list' %}">Блог</a></li>
            </ul>
        </div>
    </nav>
</div>
{% block content %}
{% endblock %}

<script src="{% static "js/bootstrap.bundle.min.js" %}"></script>
</body>
</html>
