{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="container mt-4">
        <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
            <h1 class="display-4">{% if form.instance.pk %}Редактировать пост{% else %}Создать пост{% endif %}</h1>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_title">Заголовок</label>
                <input type="text" name="title" class="form-control" id="id_title" value="{{ form.instance.title }}" required>
            </div>

            <div class="mb-3">
                <label for="id_content">Содержимое</label>
                <textarea name="content" class="form-control" id="id_content" rows="6" required>{{ form.instance.content }}</textarea>
            </div>

            <div class="mb-3">
                <label for="image">Изображение</label>
                {% if form.instance.preview_image %}
                    <div class="mb-2">
                        <img src="{{ form.instance.preview_image.url }}" alt="Текущее изображение" class="img-thumbnail" style="max-height: 200px;">
                    </div>
                {% endif %}
                <input type="file" name="preview_image" class="form-control" id="id_preview_image" accept="image/*">
            </div>

            <div class="form-group form-check">
                <input type="checkbox" name="is_published" id="id_is_published" class="form-check-input"
                       {% if form.instance.is_published %}checked{% endif %}>
                <label class="form-check-label" for="id_is_published">Опубликовать</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg mt-3">Сохранить</button>
            <a href="{% url 'blog:post_list' %}" class="btn btn-secondary btn-lg mt-3">Отменить</a>
        </form>
    </div>
{% endblock %}
