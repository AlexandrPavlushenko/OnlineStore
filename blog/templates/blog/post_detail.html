{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ post.title }}</title>
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>{{ post.title }}</h1>
    <small>Создан: {{ post.created_at }} | Просмотров: {{ post.views_count }}</small>
    {% if post.preview_image %}
    <img src="{{ post.preview_image.url }}" class="img-fluid mt-3" alt="Превью">
    {% endif %}
    <div class="mt-3">
        <p>{{ post.content }}</p>
    </div>
    <a href="{% url 'blog:post_edit' post.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Назад к списку</a>
</div>

<script src="{% static "js/bootstrap.bundle.min.js" %}"></script>
</body>
</html>
